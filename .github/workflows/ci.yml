name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly, so a new advisory shows up on its own rather than in
    # whichever commit happens to come next.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The claim this project is built on is a single native binary on all
  # three desktops, so every commit is built and tested on all three.
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux libraries Bevy links against
        if: runner.os == 'Linux'
        # Stalls in the packaging that have nothing to do with this
        # project; see the script.
        timeout-minutes: 10
        run: ./scripts/linux_deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: The examples all simulate
        shell: bash
        run: |
          cargo build --release -p oxidelica-cli
          status=0
          for model in examples/*.mo; do
            if ! ./target/release/oxidelica simulate "$model" > /dev/null 2>&1; then
              echo "FAILED: $model"
              status=1
            fi
          done
          exit $status

  # How much of the standard library this compiler reads. The three
  # numbers were measured by hand before every commit and believed on
  # trust afterwards, and nothing stopped one of them going down.
  # Once, where the library is cheapest to fetch.
  library:
    name: the standard library still reads
    runs-on: ubuntu-latest
    # A ceiling of our own. Without one the job runs under GitHub's
    # six hours, which is not a limit anybody chose: a model that
    # takes for ever would hold a runner most of a working day before
    # anyone heard about it. Ninety minutes is above what this job
    # takes today - around half an hour, most of it one model - and
    # low enough that going wrong is news the same morning.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned to the release the floors were measured against: a
      # library that moved under us would move the numbers with it, and
      # that is not what this job is asking about.
      - name: The standard library
        uses: actions/checkout@v5
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.1.0
          path: .msl

      - name: Read it
        run: |
          cargo build --release -p oxidelica-cli
          ./scripts/library_floor.sh .msl

  # Coverage and the linters for everything that is not Rust run once,
  # where the tooling is cheapest to install.
  quality:
    name: coverage and linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux libraries Bevy links against
        # Stalls in the packaging that have nothing to do with this
        # project; see the script.
        timeout-minutes: 10
        run: ./scripts/linux_deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # Pinned: an unpinned linter turns a green commit red on a
      # release that has nothing to do with it, and an unpinned
      # coverage tool moves the number the threshold is checked
      # against. Raise these deliberately, not by waking up to them.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0,taplo-cli@0.10.0,typos-cli@1.49.0,cargo-machete@0.9.2

      - name: Core coverage, the floor is 92.5% of lines
        run: ./scripts/coverage.sh --summary-only

      - name: TOML
        run: |
          taplo fmt --check --diff
          taplo check

      - name: Markdown, JSON and YAML
        run: npx --yes prettier@3.9.6 --check "**/*.{md,json,yaml,yml}" --log-level warn

      - name: Markdown rules
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "!target"

      - name: Spelling
        run: typos

      - name: No Cyrillic outside the files that may hold it
        run: python3 scripts/check_cyrillic.py

      - name: Unused dependencies
        run: cargo machete

      - name: Documentation builds, and every public item has some
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Pinned like the rest. What keeps this job current is the
      # advisory database, which is fetched as it runs - the tool
      # floating only means it could start behaving differently on a
      # week nobody touched anything.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
