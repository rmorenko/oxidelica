name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly, so a new advisory shows up on its own rather than in
    # whichever commit happens to come next.
    - cron: "0 6 * * 1"
    # Daily, for the heavy models below, which no push measures. They
    # cost most of an hour between them and nothing waits on the answer,
    # so once a night is the right rate: a regression in one of them is
    # a morning's news rather than a week's.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "One heavy model to run on its own, e.g. Modelica.Electrical.Spice3.Examples.Spice3BenchmarkFourBitBinaryAdder.FOURBIT. Empty runs the whole list against its floors."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  # The claim this project is built on is a single native binary on all
  # three desktops, so every commit is built and tested on all three.
  test:
    name: test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The daily cron exists for the heavy job below, and nothing else
    # here has anything to say about a night on which the code did not
    # move. Left unguarded this job woke a morning with the runner's
    # weather. The weekly cron is the advisory sweep, and a full pass
    # once a week is worth having.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux libraries Bevy links against
        if: runner.os == 'Linux'
        # Stalls in the packaging that have nothing to do with this
        # project; see the script.
        timeout-minutes: 10
        run: ./scripts/linux_deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: The examples all simulate
        shell: bash
        run: |
          cargo build --release -p oxidelica-cli
          status=0
          for model in examples/*.mo; do
            if ! ./target/release/oxidelica simulate "$model" > /dev/null 2>&1; then
              echo "FAILED: $model"
              status=1
            fi
          done
          exit $status

  # How much of the standard library this compiler reads. The three
  # numbers were measured by hand before every commit and believed on
  # trust afterwards, and nothing stopped one of them going down.
  # Once, where the library is cheapest to fetch.
  library:
    name: the standard library still reads
    runs-on: ubuntu-latest
    # The daily cron exists for the heavy job below, and nothing else
    # here has anything to say about a night on which the code did not
    # move. Left unguarded this job woke a morning with the runner's
    # weather. The weekly cron is the advisory sweep, and a full pass
    # once a week is worth having.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    # A ceiling of our own. Without one the job runs under GitHub's
    # six hours, which is not a limit anybody chose: a model that
    # takes for ever would hold a runner most of a working day before
    # anyone heard about it. Ninety minutes is above what this job
    # takes today - around half an hour, most of it one model - and
    # low enough that going wrong is news the same morning.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned to the release the floors were measured against: a
      # library that moved under us would move the numbers with it, and
      # that is not what this job is asking about.
      - name: The standard library
        uses: actions/checkout@v5
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.1.0
          path: .msl

      - name: Read it
        run: |
          cargo build --release -p oxidelica-cli
          ./scripts/library_floor.sh .msl

  # The models the check above does not measure, measured here. Three
  # `Spice3` benchmarks cost seventy-two percent of the run half between
  # them and what they measure is the speed of the solver, so they are
  # named in `scripts/heavy_models.txt` and skipped there - but a model
  # carved out of a measurement and given no floor has its regression
  # hidden for ever, so they keep floors of their own here.
  #
  # On the schedule and by hand, not on every push: nothing waits on
  # this, and red here is a finding for the next shift rather than a
  # stop signal - a benchmark can grow slower because of the runner it
  # was handed.
  heavy:
    name: the heavy models still read
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Wider than the main job's ninety, because these are the models
    # that job could not afford. Measured on a desk at around forty-five
    # minutes for the three, and a shared runner is the slower machine.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The standard library
        uses: actions/checkout@v5
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.1.0
          path: .msl

      - name: Read them all, against their floors
        if: github.event.inputs.model == ''
        run: |
          cargo build --release -p oxidelica-cli
          ./scripts/heavy_floor.sh .msl

      # One model by hand. This does not go through `heavy_floor.sh`:
      # that script's floors and its check on the length of the list are
      # counted over the whole list, and a single model would put every
      # one of them on the floor. An instrument, not a ratchet.
      - name: Read the one model asked for
        if: github.event.inputs.model != ''
        run: |
          cargo build --release -p oxidelica-cli
          time ./target/release/oxidelica library check .msl --only '${{ github.event.inputs.model }}'

  # Coverage and the linters for everything that is not Rust run once,
  # where the tooling is cheapest to install.
  quality:
    name: coverage and linters
    runs-on: ubuntu-latest
    # The daily cron exists for the heavy job below, and nothing else
    # here has anything to say about a night on which the code did not
    # move. Left unguarded this job woke a morning with the runner's
    # weather. The weekly cron is the advisory sweep, and a full pass
    # once a week is worth having.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux libraries Bevy links against
        # Stalls in the packaging that have nothing to do with this
        # project; see the script.
        timeout-minutes: 10
        run: ./scripts/linux_deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # Pinned: an unpinned linter turns a green commit red on a
      # release that has nothing to do with it, and an unpinned
      # coverage tool moves the number the threshold is checked
      # against. Raise these deliberately, not by waking up to them.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0,taplo-cli@0.10.0,typos-cli@1.49.0,cargo-machete@0.9.2

      - name: Core coverage, the floor is 92.5% of lines
        run: ./scripts/coverage.sh --summary-only

      - name: TOML
        run: |
          taplo fmt --check --diff
          taplo check

      - name: Markdown, JSON and YAML
        run: npx --yes prettier@3.9.6 --check "**/*.{md,json,yaml,yml}" --log-level warn

      - name: Markdown rules
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "!target"

      - name: Spelling
        run: typos

      - name: No Cyrillic outside the files that may hold it
        run: python3 scripts/check_cyrillic.py

      - name: Unused dependencies
        run: cargo machete

      - name: Documentation builds, and every public item has some
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Pinned like the rest. What keeps this job current is the
      # advisory database, which is fetched as it runs - the tool
      # floating only means it could start behaving differently on a
      # week nobody touched anything.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
