name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly, so a new advisory shows up on its own rather than in
    # whichever commit happens to come next.
    - cron: "0 6 * * 1"
    # Daily, for the heavy models below, which no push measures. They
    # cost most of an hour between them and nothing waits on the answer,
    # so once a night is the right rate: a regression in one of them is
    # a morning's news rather than a week's.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "One heavy model to run on its own, e.g. Modelica.Electrical.Spice3.Examples.Spice3BenchmarkFourBitBinaryAdder.FOURBIT. Empty runs the whole list against its floors."
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a push touched anything but prose. Of the thirty commits
  # up to f71f51a, twenty-four changed nothing but notes, and each of
  # them paid for the tests on three platforms and a library job of
  # well over an hour that could not have printed a different number. The dear jobs below
  # wait on this answer; the linters that read the notes do not.
  #
  # What counts as prose is named and everything else is code, rather
  # than the other way round: a file nobody thought to list - an
  # example, a test model, this workflow itself - is then measured, and
  # the mistake a list invites is a run too many rather than a check
  # skipped. Anything the push cannot be compared against - a pull
  # request, the schedule, a run by hand, a first push or a history
  # rewritten under it - counts as code too.
  #
  # A run that skips the library job says so in its log and its
  # summary, so that a green run with no library measurement behind it
  # can be told from one that measured.
  changes:
    name: what the push touched
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prose or code
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          code=true
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] \
            && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
            && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
            echo "changed since $BEFORE:"
            echo "$changed"
            if [ -n "$changed" ] \
              && ! echo "$changed" | grep -Ev '^docs/|\.md$' > /dev/null; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = true ]; then
            echo "library job: runs (code changed)"
          else
            echo "library job: skipped (docs only)"
            echo "library job: skipped (docs only)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # The claim this project is built on is a single native binary on all
  # three desktops, so every commit is built and tested on all three.
  test:
    name: test on ${{ matrix.os }}
    needs: changes
    runs-on: ${{ matrix.os }}
    # The daily cron exists for the heavy job below, and nothing else
    # here has anything to say about a night on which the code did not
    # move. Left unguarded this job woke a morning with the runner's
    # weather. The weekly cron is the advisory sweep, and a full pass
    # once a week is worth having.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux libraries Bevy links against
        if: runner.os == 'Linux'
        # Stalls in the packaging that have nothing to do with this
        # project; see the script.
        timeout-minutes: 10
        run: ./scripts/linux_deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: The examples all simulate
        shell: bash
        run: |
          cargo build --release -p oxidelica-cli
          status=0
          for model in examples/*.mo; do
            if ! ./target/release/oxidelica simulate "$model" > /dev/null 2>&1; then
              echo "FAILED: $model"
              status=1
            fi
          done
          exit $status

  # How much of the standard library this compiler reads. The three
  # numbers were measured by hand before every commit and believed on
  # trust afterwards, and nothing stopped one of them going down.
  # Once, where the library is cheapest to fetch.
  #
  # Cut in two on Roman's word of 2026-10-13: a main pass and a pass of
  # the dear models named in `scripts/dear_models.txt`, side by side on
  # two runners, and a judge that adds their two reports up and holds
  # the sum to the floors, the one time band and the one set of work
  # centres in `scripts/library_floor.sh`, exactly as the single pass
  # was held. The judge also checks that the two passes read the whole
  # library between them and no model twice. The judge keeps the name
  # the single job had, so whatever reads the verdict by that name
  # reads the verdict of the whole.
  library-main:
    name: the standard library still reads, main pass
    needs: changes
    runs-on: ubuntu-latest
    # The daily cron exists for the heavy job below, and nothing else
    # here has anything to say about a night on which the code did not
    # move. Left unguarded this job woke a morning with the runner's
    # weather. The weekly cron is the advisory sweep, and a full pass
    # once a week is worth having.
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1')
    # A ceiling of our own. Without one the job runs under GitHub's
    # six hours, which is not a limit anybody chose: a model that
    # takes for ever would hold a runner most of a working day before
    # anyone heard about it. Ninety minutes was set when the job took
    # around half an hour, and it has not stayed there. The job grows
    # with the number of models that run, because each of them is
    # simulated here, and the successful runs of this job measured it:
    #
    #   7b76dd0  537 run  53.3 min
    #   20bff08  540 run  62.7 min  (after the two pipes were carved out)
    #   d7397f9  572 run  69.0 min
    #   d72cb7b  579 run  82.3 min
    #
    # From 20bff08 to d72cb7b that is 19.6 minutes for 36 models, about
    # half a minute a model, and ninety minutes left room for some
    # fourteen more.
    #
    # Half a minute a model is the average over that stretch, and it is
    # not what the next model costs. The very next series, 7d3f3f9,
    # added about nineteen minutes of flattening for ten models that
    # newly flatten - close to two minutes each - and the whole of that
    # rise sits on four names: three `ReferenceAir` media and
    # `DynamicPipes`. The cheap models were won long ago; what is left
    # to win is dear, so the cost per model rises as the work goes on
    # rather than holding. Read the headroom at the dearer rate: a
    # hundred and fifty over a job that now takes about a hundred
    # minutes leaves fifty, which is some twenty-five models at two
    # minutes each, not a hundred at half a minute.
    #
    # So this is headroom for a few weeks of work and not for a year.
    # When the job reaches about two hours the answer is to split it -
    # the flattening half and the run half are independent and would
    # sit on two runners at once - and not to raise the ceiling again.
    # Raising it twice would be a habit; the second raise is where a
    # ceiling stops being a measurement and becomes a formality.
    #
    # 5fe7065 ran 149.0 of 150 minutes on identical work (31.85M
    # points); the runner weather ranges 92-149 min on the same corpus;
    # raised to 180 on Roman's word, 2026-10-06. This is not the split:
    # it gives the verdicts back while the price of the corpus, model by
    # model, is put in front of the decision on how to cut it.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned to the release the floors were measured against: a
      # library that moved under us would move the numbers with it, and
      # that is not what this job is asking about.
      - name: The standard library
        uses: actions/checkout@v5
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.1.0
          path: .msl

      - name: Read it
        run: |
          cargo build --release -p oxidelica-cli
          ./scripts/library_floor.sh --pass main .msl main.txt

      - uses: actions/upload-artifact@v4
        with:
          name: library-main
          path: main.txt

  library-dear:
    name: the standard library still reads, dear pass
    needs: changes
    runs-on: ubuntu-latest
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1')
    # The same ceiling as the main pass, for the same reasons.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The standard library
        uses: actions/checkout@v5
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.1.0
          path: .msl

      - name: Read it
        run: |
          cargo build --release -p oxidelica-cli
          ./scripts/library_floor.sh --pass dear .msl dear.txt

      - uses: actions/upload-artifact@v4
        with:
          name: library-dear
          path: dear.txt

  library:
    name: the standard library still reads
    needs: [changes, library-main, library-dear]
    runs-on: ubuntu-latest
    if: >-
      needs.changes.outputs.code == 'true'
      && (github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1')
    # Builds the binary to ask it which models each pass reads, then
    # judges the two reports; nothing here reads a model.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The standard library
        uses: actions/checkout@v5
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.1.0
          path: .msl

      - uses: actions/download-artifact@v4
        with:
          name: library-main

      - uses: actions/download-artifact@v4
        with:
          name: library-dear

      - name: Judge the two together
        run: |
          cargo build --release -p oxidelica-cli
          ./scripts/library_floor.sh --judge .msl main.txt dear.txt

  # The models the check above does not measure, measured here. Three
  # `Spice3` benchmarks cost seventy-two percent of the run half between
  # them and what they measure is the speed of the solver, so they are
  # named in `scripts/heavy_models.txt` and skipped there - but a model
  # carved out of a measurement and given no floor has its regression
  # hidden for ever, so they keep floors of their own here.
  #
  # On the schedule and by hand, not on every push: nothing waits on
  # this, and red here is a finding for the next shift rather than a
  # stop signal - a benchmark can grow slower because of the runner it
  # was handed.
  #
  # Cut in two on Roman's word of 2026-10-19, by the hand that cut the
  # library job: two passes on two runners, the second basket named in
  # `scripts/heavy_second.txt`, and a judge that adds their two reports
  # up and holds the sum to the five floors in `scripts/heavy_floor.sh`,
  # undivided. The judge also checks that the two passes read the whole
  # list between them and no model twice, and it keeps the name the
  # single job had, so whatever reads the verdict by that name reads the
  # verdict of the whole.
  heavy-a:
    name: the heavy models still read, pass a
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.model == '')
    runs-on: ubuntu-latest
    # Raised from 180 to 240 on Roman's word, 2026-10-12, when the cron
    # on 1ff2f0d was cut at 181 minutes - the runner's weather, measured
    # as such on the desk (docs/ANALYSIS.md, m409). The cron of
    # 2026-10-19 (run 39253489374) was cut at this 240 too, with 21 of
    # 23 read in 131.6 minutes and nearly two silent hours after. The
    # answer to that was the cut and not a third raise: each pass keeps
    # the 240 the single job had, and the baskets are balanced by the
    # prices in scripts/heavy_second.txt.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The standard library
        uses: actions/checkout@v5
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.1.0
          path: .msl

      - name: Read basket a
        run: |
          cargo build --release -p oxidelica-cli
          ./scripts/heavy_floor.sh --pass a .msl heavy-a.txt

      - uses: actions/upload-artifact@v4
        with:
          name: heavy-a
          path: heavy-a.txt

  heavy-b:
    name: the heavy models still read, pass b
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.model == '')
    runs-on: ubuntu-latest
    # The same ceiling as pass a, for the same reasons.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The standard library
        uses: actions/checkout@v5
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.1.0
          path: .msl

      - name: Read basket b
        run: |
          cargo build --release -p oxidelica-cli
          ./scripts/heavy_floor.sh --pass b .msl heavy-b.txt

      - uses: actions/upload-artifact@v4
        with:
          name: heavy-b
          path: heavy-b.txt

  heavy:
    name: the heavy models still read
    needs: [heavy-a, heavy-b]
    # `always()` so that a single model asked for by hand, which skips
    # both passes, still reaches its own step below. Otherwise the judge
    # sits only on two passes that both succeeded, as the library's
    # does: a pass cut by its ceiling leaves the judge skipped rather
    # than red, so the run reads as cut and not as failed.
    if: >-
      always()
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      && (github.event.inputs.model != ''
          || (needs.heavy-a.result == 'success' && needs.heavy-b.result == 'success'))
    runs-on: ubuntu-latest
    # Builds the binary to ask it which models each pass reads, then
    # judges the two reports; nothing here reads a model, except the one
    # model asked for by hand. That is one of the heavy giants and costs
    # what the single job's step did, so the ceiling is the passes'.
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: The standard library
        uses: actions/checkout@v5
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.1.0
          path: .msl

      - uses: actions/download-artifact@v4
        if: github.event.inputs.model == ''
        with:
          name: heavy-a

      - uses: actions/download-artifact@v4
        if: github.event.inputs.model == ''
        with:
          name: heavy-b

      - name: Judge the two together, against their floors
        if: github.event.inputs.model == ''
        run: |
          cargo build --release -p oxidelica-cli
          ./scripts/heavy_floor.sh --judge .msl heavy-a.txt heavy-b.txt

      # One model by hand. This does not go through `heavy_floor.sh`:
      # that script's floors and its check on the length of the list are
      # counted over the whole list, and a single model would put every
      # one of them on the floor. An instrument, not a ratchet.
      - name: Read the one model asked for
        if: github.event.inputs.model != ''
        run: |
          cargo build --release -p oxidelica-cli
          time ./target/release/oxidelica library check .msl --only '${{ github.event.inputs.model }}'

  # Coverage and the linters for everything that is not Rust run once,
  # where the tooling is cheapest to install.
  quality:
    name: coverage and linters
    runs-on: ubuntu-latest
    # The daily cron exists for the heavy job below, and nothing else
    # here has anything to say about a night on which the code did not
    # move. Left unguarded this job woke a morning with the runner's
    # weather. The weekly cron is the advisory sweep, and a full pass
    # once a week is worth having.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    steps:
      - uses: actions/checkout@v5

      - name: Install the Linux libraries Bevy links against
        # Stalls in the packaging that have nothing to do with this
        # project; see the script.
        timeout-minutes: 10
        run: ./scripts/linux_deps.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      # Pinned: an unpinned linter turns a green commit red on a
      # release that has nothing to do with it, and an unpinned
      # coverage tool moves the number the threshold is checked
      # against. Raise these deliberately, not by waking up to them.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0,taplo-cli@0.10.0,typos-cli@1.49.0,cargo-machete@0.9.2

      - name: Core coverage, the floor is 92.5% of lines
        run: ./scripts/coverage.sh --summary-only

      - name: TOML
        run: |
          taplo fmt --check --diff
          taplo check

      - name: Markdown, JSON and YAML
        run: npx --yes prettier@3.9.6 --check "**/*.{md,json,yaml,yml}" --log-level warn

      - name: Markdown rules
        run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "!target"

      - name: Spelling
        run: typos

      - name: No Cyrillic outside the files that may hold it
        run: python3 scripts/check_cyrillic.py

      - name: The time band fires on both sides
        # Written with `if` and not `!`: a negated command does not stop
        # a `bash -e` step, so a band that stayed green would pass.
        run: |
          if ./scripts/library_floor.sh --ratio-check 1000 500; then exit 1; fi
          if ./scripts/library_floor.sh --ratio-check 1000 2000; then exit 1; fi
          ./scripts/library_floor.sh --ratio-check 1000 1045

      - name: The cut of the library job is guarded
        # A model read by neither pass would be judged by nobody while
        # every floor still held. The guard is seen red on a name left
        # out, read twice and from outside, and green on a true cut.
        run: |
          printf 'A\nB\nC\n' > all.txt
          printf 'A\n' > main.txt
          printf 'B\nC\n' > dear.txt
          ./scripts/library_floor.sh --partition-check all.txt main.txt dear.txt
          printf 'B\n' > short.txt
          printf 'A\nB\nC\n' > twice.txt
          printf 'B\nC\nD\n' > outside.txt
          for wrong in short twice outside; do
            if ./scripts/library_floor.sh --partition-check all.txt main.txt "$wrong.txt"; then exit 1; fi
          done

      - name: Unused dependencies
        run: cargo machete

      - name: Documentation builds, and every public item has some
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  audit:
    name: advisories
    runs-on: ubuntu-latest
    # The daily cron exists for the heavy job and nothing else. This
    # sweep is the reason the weekly cron is there, so it wakes on
    # that one and sleeps through the nights the code did not move.
    if: github.event_name != 'schedule' || github.event.schedule == '0 6 * * 1'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Pinned like the rest. What keeps this job current is the
      # advisory database, which is fetched as it runs - the tool
      # floating only means it could start behaving differently on a
      # week nobody touched anything.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
