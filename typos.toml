# typos - a fast source-code spell checker (Latin script only)
[files]
# The solver-pair reference holds the standard library's own variable
# names verbatim (`airGapDC.vai`), which are the library's spelling.
extend-exclude = ["target/", "Cargo.lock", "scripts/solver_pair_reference.tsv"]

[default.extend-words]
# The JetBrains theme really is named Darcula (a deliberate pun).
Darcula = "Darcula"
# `nin` is what the standard library calls the number of inputs of a
# block, as `nout` is the number of outputs.
nin = "nin"
# `alow` is what the NASA polynomials of the media library call the
# coefficients below their temperature limit, as `ahigh` is the ones
# above it.
alow = "alow"
# `Analysator` is what the Polyphase examples of the standard library
# call their measuring utilities, so it is a name and not a misspelling
# of `analyser`.
Analysator = "Analysator"
# `commutated` is the power electronics term for a bridge whose current
# is handed from one switch to the next, not a misspelling of `commuted`.
commutated = "commutated"
# `OT.mo` is the name of a parked small model in the analysis notes (a
# copy of the OneTank example), not a misspelling.
OT = "OT"
# `aSav` and `bSav` are what the Preisach hysteresis of the FluxTubes
# library calls its saved turning points, so `Sav` is a name.
Sav = "Sav"
